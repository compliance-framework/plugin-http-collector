# Test configuration for HTTP collector plugin with policy evaluation
# This tests the refactored policy-driven architecture

api:
  url: "http://localhost:8080"  # Required by agent (can be mock API)

plugins:
  health-checker-with-policies:
    source: "./plugin-http-collector"  # Path to compiled plugin binary
    policies:
      - "../plugin-http-collector-policies/dist/bundle.tar.gz"
    labels:
      type: "http-health-check"
      environment: "test"
    config:
      url: "https://httpbin.org/json"           # Test endpoint that returns JSON
      method: "GET"
      timeout: 5000
      basic_auth: false
      additional_headers: "Content-Type: application/json;User-Agent: ccf-http-collector"
      check_certificate: true
      body_regex_pattern: "slideshow"           # Simple pattern - should match the JSON response

  fast-endpoint-test:
    source: "./plugin-http-collector"
    policies:
      - "../plugin-http-collector-policies/dist/bundle.tar.gz"
    labels:
      type: "performance-check"
      environment: "test"
    config:
      url: "https://httpbin.org/status/200"     # Always returns 200 OK
      method: "GET"
      timeout: 3000
      basic_auth: false
      check_certificate: true

  auth-endpoint-test:
    source: "./plugin-http-collector"
    policies:
      - "../plugin-http-collector-policies/dist/bundle.tar.gz"
    labels:
      type: "auth-test"
      environment: "test"
    config:
      url: "https://httpbin.org/basic-auth/testuser/testpass"
      method: "GET"
      timeout: 5000
      basic_auth: true
      basic_auth_username: "testuser"
      basic_auth_password: "testpass"
      check_certificate: true

verbose: 1  # Enable debug logging to see what's happening