# Test all HTTP collector features
api:
  url: "http://localhost:8080"

plugins:
  json-with-regex:
    source: "./plugin-http-collector"
    policies: []
    config:
      url: "https://httpbin.org/json"
      method: "GET"
      timeout: 3000
      body_regex_pattern: "slideshow"
      additional_headers: "User-Agent: HTTP-Collector-Test"

  basic-auth-test:
    source: "./plugin-http-collector"
    policies: []
    config:
      url: "https://httpbin.org/basic-auth/testuser/testpass"
      method: "GET"
      timeout: 3000
      basic_auth: true
      basic_auth_username: "testuser"
      basic_auth_password: "testpass"

verbose: 1